name: Manual multi-platform build of docker image

on:
  workflow_dispatch:
    inputs:
      directory:
        description: 'File path on GitHub to Dockerfile? e.g. base_ottr'
        required: true
        type: string
      tags:
        description: 'Tag e.g. jhudsl/base_ottr:main'
        required: true
        type: string
      dockerhubpush:
        description: 'Push to Dockerhub? true or false'
        required: false
        default: 'false'
        type: string
        
jobs:
  #amd64 build
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: ${{ inputs.dockerhubpush != 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ inputs.dockerhub_token }}

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.directory }}
          file: ${{ inputs.directory }}/Dockerfile
          platforms: linux/amd64
          outputs: type=registry
          tags: ${{ inputs.tags }}-amd64

  #arm64 build
  build-arm64:
    runs-on: ubuntu-24.04-arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: ${{ inputs.dockerhubpush != 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ inputs.dockerhub_token }}

      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.directory }}
          file: ${{ inputs.directory }}/Dockerfile
          platforms: linux/arm64
          outputs: type=registry
          tags: ${{ inputs.tags }}-arm64

  #manifest assembly
  manifest:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Log in to Dockerhub
        if: ${{ inputs.dockerhubpush != 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ inputs.dockerhub_token }}

      - name: Create and push multi-arch manifest
        run: |
          docker manifest create ${{ inputs.tags }} \
            --amend ${{ inputs.tags }}-amd64 \
            --amend ${{ inputs.tags }}-arm64
          docker manifest push ${{ inputs.tags }}

