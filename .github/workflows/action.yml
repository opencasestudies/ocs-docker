# Updated Kate Isaac Aug 2026
name: 'Build Multi-Platform Docker Image'
description: 'Multi-arch build and push from a dockerfile in the repository'
inputs:
  directory:
    description: "What's the file path to this Dockerfile's folder in this repo"
    required: true
    type: string
  tag:
    description: 'What is this called on Dockerhub? e.g. jhudsl/base_ottr'
    required: true
    type: string
  dockerhubpush:
    description: 'Should this be pushed to Dockerhub?'
    required: false
    default: 'false'
    type: string
  token:
    description: 'A GitHub Personal Access Token'
    required: false
  dockerhub_username:
    description: 'A Dockerhub username that has access to this image'
    required: false
  dockerhub_token:
    description: 'A Dockerhub token that has persmissions to push to this image'
    required: false

outputs:
  success:
    value: ${{ steps.push.outcome }}

jobs:
  #amd64 build
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ inputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: ${{ inputs.dockerhubpush != 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ inputs.dockerhub_token }}

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.directory }}
          file: ${{ inputs.directory }}/Dockerfile
          platforms: linux/amd64
          outputs: type=registry
          tags: ${{ inputs.tags }}-amd64

  #arm64 build
  build-arm64:
    runs-on: ubuntu-24.04-arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ inputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: ${{ inputs.dockerhubpush != 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ inputs.dockerhub_token }}

      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.directory }}
          file: ${{ inputs.directory }}/Dockerfile
          platforms: linux/arm64
          outputs: type=registry
          tags: ${{ inputs.tags }}-arm64

  #manifest assembly
  manifest:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Log in to Dockerhub
        if: ${{ inputs.dockerhubpush != 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ inputs.dockerhub_token }}

      - name: Create and push multi-arch manifest
        run: |
          docker manifest create ${{ inputs.tags }} \
            --amend ${{ inputs.tags }}-amd64 \
            --amend ${{ inputs.tags }}-arm64
          docker manifest push ${{ inputs.tags }}
